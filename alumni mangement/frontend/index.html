
<!DOCTYPE html>
<html>
<head>
  <title>Alumni Directory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h2>Alumni Directory</h2>
  <div id="searchForm">
    <input type="text" id="search" placeholder="Search by name or course">
    <button onclick="searchAlumni()">Search</button>
  </div>
  <table id="alumniTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Graduation Year</th>
        <th>Course</th>
        <th>Phone</th>
        <th>Address</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <script src="script.js"></script>
</body>
</html>
